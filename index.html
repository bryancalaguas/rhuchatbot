<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RHU III Dental Booking Chatbot</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d0d;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="chat-frame" src="https://cdn.botpress.cloud/webchat/v3.7/shareable.html?configUrl=https://files.bpcontent.cloud/2026/10/04/00/20261004000148-OMHXQ2TB.json"></iframe>

  <script>
    const iframe = document.getElementById('chat-frame');

    iframe.onload = function() {
      // Send initialization event to trigger SAUP's greeting automatically
      setTimeout(() => {
        iframe.contentWindow.postMessage({
          type: 'event',
          payload: { type: 'proactive-trigger' }
        }, '*');
      }, 500);
    };
  </script>
</body>
</html>
